name: Firmware build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check embedded OTA key matches release key
        run: |
          diff <(sed -n '/-----BEGIN PUBLIC KEY-----/,/-----END PUBLIC KEY-----/p' src/ota_updater.cpp \
                   | sed 's/^.*R"KEY(//') \
               release/firmware-signing-public.pem

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio

      - name: Build firmware
        run: pio run

      - name: Run native unit tests
        run: pio test -e native
