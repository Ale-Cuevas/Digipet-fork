[platformio]
default_envs = waveshare_amoled_216, waveshare_amoled_216_bringup

; Waveshare ESP32-S3-Touch-AMOLED-2.16 (480x480 CO5300, CST9220 touch), the
; only board this fork supports. All pins and addresses come from
; include/board_amoled_216.h.
; Platform and libraries are pinned to exact releases on purpose: pioarduino's
; "stable" tag is re-uploaded in place, so the build would change underneath us.
; SensorLib and XPowersLib are the driver versions Waveshare's own demo
; ships for this board (CST92xx touch, QMI8658, PCF85063, AXP2101).
[env:waveshare_amoled_216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.embed_files =
    src/assets/boot_clip.pcm
    src/assets/boot_mascot_0.rgb565
    src/assets/boot_mascot_1.rgb565
    src/assets/boot_mascot_2.rgb565
    src/assets/boot_mascot_3.rgb565
    src/assets/boot_mascot_4.rgb565
    src/assets/boot_mascot_5.rgb565
; Everything under src/ except game/, plus one explicit game module --
; the same build_src_filter mechanism [env:native] below already uses to
; cherry-pick sources, applied here so a future second game module
; (src/game/<name>/*.cpp) is a sibling directory and a copy of this line
; with the path changed, not a rewrite of this env. +<*.cpp> only matches
; top-level files, so the bring-up firmware in src/bringup_216/ stays out.
build_src_filter = -<*> +<*.cpp> -<game/> +<game/vpet/*.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.2
    lewisxhe/XPowersLib@0.2.6
    lewisxhe/SensorLib@0.3.3
build_flags =
    -D BOARD_AMOLED_216
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D DIGIPET_VERSION=\"0.2.0\"
    -D DIGIPET_OTA_REPO=\"Ale-Cuevas/Digipet-fork\"

; Standalone hardware test for the same board (src/bringup_216/): exercises
; each peripheral on its own and logs to USB serial, so a failure points at
; one chip. Kept alongside the pet app for checking a board in isolation.
[env:waveshare_amoled_216_bringup]
extends = env:waveshare_amoled_216
board_build.embed_files =
build_src_filter = -<*> +<bringup_216/*.cpp>
lib_deps =
    lewisxhe/XPowersLib@0.2.6
    lewisxhe/SensorLib@0.3.3
build_flags =
    -D BOARD_AMOLED_216
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Host-native unit tests for hardware-independent logic. Deliberately
; separate from waveshare_amoled_216: it never touches the ESP32 toolchain
; or NimBLE/WiFi/etc, so it only builds the specific pure-logic sources it
; is given via build_src_filter. See test/native/fakes for what's stubbed.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<game/vpet/pet_genome.cpp> +<game/vpet/familiar_battle_rules.cpp> +<color_utils.cpp>
build_flags =
    -std=gnu++17
    -Itest/native/fakes
